name: release

# Push a v*.*.* tag and the workflow builds + publishes the multi-arch image
# to GHCR with the right OCI annotations so the package auto-links to this
# repo (no manual web UI clicks).
#
# Manual release path is still documented in CONTRIBUTING.md as a fallback.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read       # checkout
  packages: write      # push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `docker/metadata-action` derives image tags and OCI annotations from
      # the git ref. For tag pushes (v1.2.3) we get: 1.2.3, 1.2, 1, latest.
      # The action also emits OCI annotations on the manifest INDEX, which is
      # what GHCR's UI needs to link the package to this repo and show the
      # description/license. Plain `LABEL` in the Dockerfile is NOT enough
      # for multi-arch images — see CONTRIBUTING.md (Releasing) for why.
      - name: Extract metadata (tags, annotations)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Preserve the `v` prefix to match how git tags are named
          # (`v0.3.2`, not `0.3.2`). Without `v{{version}}` the action
          # strips it — leaving manifests that reference `:v0.3.2` unable
          # to pull. Each pattern is a separate tag the image gets.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          # Annotations land on the OCI manifest index for multi-arch builds.
          annotations: |
            org.opencontainers.image.title=grafana-slack-bridge
            org.opencontainers.image.description=Grafana → Slack webhook receiver that does chat.update for in-place alert updates
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          # Both annotations + labels — the labels go into per-platform image
          # configs (useful for `docker inspect`), the annotations go onto
          # the multi-arch manifest index (used by GHCR's UI).
          cache-from: type=gha
          cache-to: type=gha,mode=max
