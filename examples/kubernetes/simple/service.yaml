---
apiVersion: v1
kind: Service
metadata:
  name: grafana-slack-bridge
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana-slack-bridge
spec:
  type: ClusterIP                # never expose via Ingress / LoadBalancer
  selector:
    app.kubernetes.io/name: grafana-slack-bridge
  ports:
    - name: http
      port: 80
      targetPort: http
