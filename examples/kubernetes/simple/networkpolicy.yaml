---
# Optional: restrict /webhook to only be reachable from Grafana pods in the
# same namespace. Recommended for any production deployment.
#
# Adjust the `from.podSelector` to match how YOUR Grafana pods are labeled
# (e.g. `app.kubernetes.io/name: grafana`, `app: grafana`, etc.).
#
# Apply only if your cluster has a NetworkPolicy controller (Calico, Cilium,
# the AWS VPC CNI, etc.).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-slack-bridge
  namespace: grafana
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-slack-bridge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 8080
          protocol: TCP
