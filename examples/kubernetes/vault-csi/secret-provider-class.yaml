---
# Pulls the bridge's Grafana service-account render token from Vault via the
# Secrets Store CSI driver, then syncs it into a regular k8s Secret so the
# deployment can envFrom it.
#
# Prerequisites (one-time; see vault-setup.sh):
#   - Vault Kubernetes auth method enabled at <VAULT_AUTH_PATH>
#   - Policy `grafana-slack-bridge` granting read on the KV data path
#   - Role `grafana-slack-bridge` binding policy → ServiceAccount
#   - KV value at <VAULT_KV_MOUNT>/<VAULT_KV_PATH> with field `token`

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: grafana-slack-bridge-vault-secrets
  namespace: grafana
spec:
  provider: vault
  parameters:
    vaultAddress: "<VAULT_ADDR>"
    vaultAuthMountPath: "<VAULT_AUTH_PATH>"
    roleName: "grafana-slack-bridge"
    objects: |
      - objectName: "grafana-render-token"
        # KV v2 inserts /data/ between the mount and the logical path. KV v1
        # does NOT — adjust accordingly.
        secretPath: "<VAULT_KV_MOUNT>/data/<VAULT_KV_PATH>"
        secretKey: "token"

  # Sync the Vault value into a regular k8s Secret so the deployment can
  # consume it via envFrom without in-process file watching. The Secret
  # is created and maintained by the CSI driver while at least one pod
  # referencing this SPC is running.
  secretObjects:
    - secretName: grafana-bridge-render-token
      type: Opaque
      data:
        - objectName: "grafana-render-token"
          key: GRAFANA_TOKEN
