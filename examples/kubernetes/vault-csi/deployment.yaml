---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-slack-bridge
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana-slack-bridge
    app.kubernetes.io/version: v0.3.0
spec:
  replicas: 1                          # in-memory state — do not scale horizontally
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-slack-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-slack-bridge
    spec:
      # Bridge runs as a dedicated SA so Vault's k8s auth backend can bind
      # to it via the matching Vault role.
      serviceAccountName: grafana-slack-bridge
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: bridge
          image: ghcr.io/your-org/grafana-slack-bridge:v0.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SLACK_CHANNEL
              value: "alerts-grafana"
            - name: SLACK_CHANNEL_ID
              value: "C012345ABCD"
            - name: STATE_TTL_HOURS
              value: "24"
            - name: GRAFANA_URL
              value: "http://grafana:3000"
          envFrom:
            # Slack bot token — still a regular k8s Secret (created out of band).
            - secretRef:
                name: grafana-slack-bot-token
                optional: false
            # Grafana render token — provided by the SecretProviderClass below,
            # which syncs it from Vault. optional: true because pods can start
            # without the Vault sync (image rendering will be skipped); the
            # CSI mount itself still triggers the sync.
            - secretRef:
                name: grafana-bridge-render-token
                optional: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # The Vault CSI driver materializes secrets here. The app doesn't
            # read this path directly — the SPC also syncs the value into a
            # k8s Secret (grafana-bridge-render-token) which feeds GRAFANA_TOKEN
            # via envFrom above. The CSI mount itself keeps the driver actively
            # syncing the SPC.
            - name: vault-secrets
              mountPath: /mnt/vault-secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: vault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: grafana-slack-bridge-vault-secrets
